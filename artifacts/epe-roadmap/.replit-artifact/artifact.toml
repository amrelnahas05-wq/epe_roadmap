kind = "web"
previewPath = "/"
title = "EPE Course Roadmap"
version = "1.0.0"
id = "artifacts/epe-roadmap"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24387

[services.development]
run = "pnpm --filter @workspace/epe-roadmap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/epe-roadmap", "run", "build" ]
publicDir = "artifacts/epe-roadmap/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24387"
BASE_PATH = "/"
